name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install linting tools
        run: pip install ruff==0.9.10 yamllint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: YAML lint
        run: yamllint -d relaxed configs/ unification/simulation_physics/physics_parameter_mapping.yaml q1-2026-standards/objective-2-robot-model-repository/model_registry.yaml

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install base dependencies
        run: pip install numpy scipy

      - name: Check Python syntax
        run: python -m py_compile scripts/verify_installation.py

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install numpy scipy pytest

      - name: Verify environment
        run: |
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import scipy; print('scipy', scipy.__version__)"
          python -c "import pytest; print('pytest', pytest.__version__)"
          python -c "from pathlib import Path; p = Path('tests/conftest.py'); print('conftest exists:', p.exists())"
          python -c "import sys; sys.path.insert(0, '.'); from tests.conftest import load_module; print('load_module import OK')"

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=long -W default
